name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn --batch-mode test
      - name: Package executable API
        run: mvn --batch-mode -DskipTests package
      - name: Upload executable demo
        uses: actions/upload-artifact@v4
        with:
          name: arder-card-rpg-demo
          path: fantasy-sim-api/target/fantasy-sim-api-2.1.0.jar
          if-no-files-found: error
          retention-days: 14
