name: fantasy-sim

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantasy_sim}
      POSTGRES_USER: ${POSTGRES_USER:-fantasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fantasy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fantasy_sim}
      DB_USERNAME: ${POSTGRES_USER:-fantasy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      FANTASY_AI_ENDPOINT: ${FANTASY_AI_ENDPOINT:-}
      FANTASY_AI_API_KEY: ${FANTASY_AI_API_KEY:-}
      FANTASY_AI_MODEL: ${FANTASY_AI_MODEL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  fantasy-db:
