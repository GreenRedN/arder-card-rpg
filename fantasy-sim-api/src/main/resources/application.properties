server.port=8080
spring.application.name=fantasy-sim

# Local runs use an on-disk H2 database. Production can provide a PostgreSQL JDBC URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fantasy-sim;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.error.include-message=never

# Optional OpenAI-compatible narrative-director endpoint. Curated prose and a
# clearly labelled rule fallback remain when configuration is absent or fails.
fantasy.ai.endpoint=${FANTASY_AI_ENDPOINT:}
fantasy.ai.api-key=${FANTASY_AI_API_KEY:}
fantasy.ai.model=${FANTASY_AI_MODEL:}
